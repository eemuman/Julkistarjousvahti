<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Tarjousvahti</title>
    <style>
      /* Ennen JS:ää näkyvä latausnäkymä. Värit vastaavat styles.css:n teemamuuttujia. */
      html, body { margin: 0; background: #16181d; color: #f1f2f4; }
      body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      .loader { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .loader-spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid rgba(154, 161, 173, 0.25);
        border-top-color: #ff7a1a;
        animation: loader-spin 0.9s linear infinite;
      }
      .loader-text { margin: 0; color: #9aa1ad; text-align: center; }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        html, body { background: #f5f5f3; color: #17191e; }
        .loader-spinner { border-color: rgba(95, 102, 114, 0.25); border-top-color: #ff7a1a; }
        .loader-text { color: #5f6672; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-spinner { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader" role="status" aria-live="polite">
        <span class="loader-spinner" aria-hidden="true"></span>
        <p class="loader-text">Ladataan tietoja…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
